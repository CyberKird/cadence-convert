appId: com.cyberkird.cadenceconvert
productName: Cadence Convert
copyright: MIT

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true

nsis:
  artifactName: ${productName}-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: CyberKird
  repo: cadence-convert
